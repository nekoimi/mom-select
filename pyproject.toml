[project]
name = "mom-select"
version = "0.1.0"
description = "Local ETF momentum signal generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "playwright>=1.50",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "requests[socks]>=2.32",
]

[project.scripts]
mom-select = "mom_select.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mom_select"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
exclude = ["original.py", "data", "reports"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
