runtime:
  project_dir: .
  workers: 8
  fixed_pool_only: false

tasks:
  etf:
    enabled: true
    schedule:
      timezone: Asia/Shanghai
      day_of_week: mon-fri
      hour: 13
      minute: 5
      misfire_grace_time: 300
    paths:
      pool: config/etf_pool.csv
      portfolio: config/portfolio.csv
      cache_dir: data/cache/etf
      report_dir: reports/etf
      state_file: data/state/etf/market_state.json
    strategy:
      lookback_days: 25
      min_score: 0.0
      max_score: 5.0
      r2_threshold: 0.4
      ma_lookback: 10
      volume_lookback: 5
      volume_threshold: 1.8
      daily_loss_floor: 0.97
      liquidity_lookback: 3
      min_average_turnover: 10000000
      holdings_num: 1
      retention_ratio: 0.9
      defensive_etf: 511880.XSHG
      minimum_data_coverage: 0.8

  stock:
    # Full-market stock scanning is opt-in because it creates substantially
    # more public data-source requests than the ETF task.
    enabled: false
    schedule:
      timezone: Asia/Shanghai
      day_of_week: mon-fri
      hour: 15
      minute: 20
      misfire_grace_time: 300
    paths:
      cache_dir: data/cache/stock
      report_dir: reports/stock
    strategy:
      trend_windows: [20, 60, 120]
      benchmark: 000300.XSHG
      max_results: 20
      minimum_momentum_score: 0.0
      entry_candidate_results: 30
      minimum_universe_size: 1000
      minimum_listing_days: 250
      liquidity_lookback: 20
      screen_minimum_turnover: 300000000
      price_lower_bound_inclusive: 5
      price_upper_bound_inclusive: 55
      snapshot_minimum_change: 0.01
      snapshot_maximum_change: 0.10
      snapshot_minimum_turnover_rate: 0.03
      snapshot_maximum_turnover_rate: 0.15
      minimum_data_coverage: 0.8
      entry_max_distance_ma20: 0.08
      trend_minimum_return_20d: 0.10
      trend_minimum_return_60d: 0.20
      entry_max_return_20d: 0.20
      entry_max_drawdown_from_60d_high: 0.12

notifications:
  enabled: false
  channels:
    - type: wechat
      name: default
      webhook: ${WECHAT_WEBHOOK}
    - type: telegram
      name: default
      bot_token: ${TELEGRAM_BOT_TOKEN}
      chat_id: ${TELEGRAM_CHAT_ID}
      proxy: ${TELEGRAM_PROXY}
    - type: email
      name: default
      host: smtp.example.com
      port: 465
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      from: ${SMTP_FROM}
      to: [you@example.com]
      use_ssl: true
