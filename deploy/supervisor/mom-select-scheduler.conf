; Copy this file to /etc/supervisor/conf.d/mom-select-scheduler.conf and
; replace /opt/mom-select with the actual deployment directory.

[program:mom-select-scheduler]
directory=/opt/mom-select
; uv sync creates this project virtual environment; run with its interpreter.
command=/opt/mom-select/.venv/bin/python /opt/mom-select/scripts/mom_select_scheduler.py --project-dir /opt/mom-select --portfolio /opt/mom-select/config/portfolio.csv
user=ubuntu
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
environment=TZ="Asia/Shanghai",PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/mom-select-scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/mom-select-scheduler-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
